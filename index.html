<title>Hardwood Dynasty</title>

<style>
:root{
  --bg:#e9eef3; --surface:#ffffff; --surface2:#f3f6f9; --ink:#14223a; --muted:#5a6779; --line:#d3dbe4;
  --board:#0f1b2d; --board-ink:#f6f8fb; --amber:#f2a900; --amber-ink:#1a1300; --win:#127a3e; --loss:#b3261e; --link:#1b5fb8;
  --disp:"Saira Condensed","Arial Narrow",Arial,sans-serif; --text:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1320; --surface:#132033; --surface2:#1a2a41; --ink:#e8eef6; --muted:#9aa8bb; --line:#26384f;
  --board:#060d18; --board-ink:#f6f8fb; --amber:#f5b82e; --amber-ink:#1a1300; --win:#4cc27c; --loss:#ff7a70; --link:#7fb2ff; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b1320; --surface:#132033; --surface2:#1a2a41; --ink:#e8eef6; --muted:#9aa8bb; --line:#26384f;
  --board:#060d18; --board-ink:#f6f8fb; --amber:#f5b82e; --amber-ink:#1a1300; --win:#4cc27c; --loss:#ff7a70; --link:#7fb2ff; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--board)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 108px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);color:var(--board-ink)}
header.top .in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
header.top .nm{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1.05;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12.5px;color:#aebbd0}
header.top .rt{margin-left:auto;text-align:right;font-family:var(--disp);font-size:15px;color:#aebbd0;line-height:1.1}
header.top .rt b{color:var(--amber);font-size:19px;font-weight:700}
.bdg{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid;font-family:var(--disp);font-weight:800;flex:none;letter-spacing:-.2px;line-height:1}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;letter-spacing:.2px}
h2{font-size:22px;margin:20px 0 8px}
h3{font-size:18px;margin:0 0 6px}
.muted{color:var(--muted)}
.sm{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.dark{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.btn.sm{padding:8px 12px;font-size:13.5px;min-height:36px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;margin:14px 0 6px;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,40,.15)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.li:first-child{border-top:0}
button.li:hover{background:var(--surface2)}
.rk{font-family:var(--disp);font-weight:700;width:26px;text-align:right;color:var(--muted);flex:none}
.num{font-family:var(--disp);font-weight:600;font-variant-numeric:tabular-nums}
.W{color:var(--win);font-weight:700}.L{color:var(--loss);font-weight:700}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.amb{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--amber)}
.bar.g i{background:var(--win)}
.bar.r i{background:var(--loss)}
.stars{color:var(--amber);letter-spacing:-1px;font-size:13px;white-space:nowrap}
/* scoreboard: the one loud element */
.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:14px;margin:12px 0;position:relative;overflow:hidden}
.board .when{font-size:12.5px;color:#aebbd0;display:flex;justify-content:space-between;gap:8px}
.board .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 6px}
.board .side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.board .tn{font-family:var(--disp);font-weight:700;font-size:18px;line-height:1.05}
.board .rec{font-family:var(--disp);font-size:14px;color:#aebbd0}
.board .mid{font-family:var(--disp);font-size:15px;color:var(--amber);text-align:center}
.board .stripe{position:absolute;left:0;right:0;top:0;height:5px;display:flex}
.board .stripe span{flex:1}
.board .prob{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:6px}
.lcd{font-family:var(--disp);font-weight:800;font-size:42px;color:var(--amber);letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-family:var(--disp);font-weight:600;color:var(--muted);font-size:13px;border-top:0;position:sticky;top:0;background:var(--surface)}
td:first-child,th:first-child{text-align:left}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
nav.tabs button{border:0;background:none;padding:8px 0 7px;font-size:10.5px;min-height:52px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{color:var(--amber)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88vh;max-height:88dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--board);color:var(--board-ink);padding:10px 16px;border-radius:9px;z-index:50;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
select,input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.news .li{align-items:flex-start}
.attr{display:grid;grid-template-columns:108px 1fr 30px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.bk{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.bk .col{min-width:168px;display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.bk .col h4{font-family:var(--disp);font-weight:600;margin:0;color:var(--muted);font-size:14px}
.mg{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:13px}
.mg div{display:flex;align-items:center;gap:6px;padding:5px 7px}
.mg div+div{border-top:1px solid var(--line)}
.mg .s{width:16px;color:var(--muted);font-family:var(--disp);text-align:right}
.mg .sc{margin-left:auto;font-family:var(--disp);font-weight:700}
.mg .wn{font-weight:700}
.hero{background:var(--board);color:var(--board-ink);margin:0 -14px;padding:34px 18px 26px}
.hero h1{font-size:46px;line-height:.95;font-weight:800}
.hero p{color:#c3cede;max-width:52ch;margin:10px 0 0}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:3px solid var(--amber);padding:16px 0 6px;margin-bottom:10px}
.mast-n{font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:.2px;line-height:1}
.mast-s{font-size:12.5px;color:var(--muted);text-align:right}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;min-width:128px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:13px;text-align:left;display:flex;flex-direction:column;gap:3px}
.chip div{display:flex;gap:6px;align-items:center}
.chip .sc{margin-left:auto;font-family:var(--disp);font-weight:700}
.hs{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;background:var(--board);color:var(--board-ink);border:0;border-radius:12px;padding:20px 14px 14px;position:relative;overflow:hidden;margin:6px 0 4px}
.hs .stripe{position:absolute;left:0;right:0;top:0;height:5px;display:flex}
.hs .stripe span{flex:1}
.hh{font-family:var(--disp);font-weight:800;font-size:27px;line-height:1.04}
.hb{color:#c3cede;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sel{background:var(--board);color:var(--board-ink);border-radius:14px;padding:20px 16px;min-height:50vh}
.selh{font-family:var(--disp);font-weight:800;font-size:54px;line-height:.92;margin:8px 0 12px}
.reg{font-family:var(--disp);font-weight:800;font-size:58px;line-height:.95;color:var(--amber)}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;min-width:0}
.srow+.srow{border-top:1px solid #22344c}
.srow .sd{font-family:var(--disp);font-weight:800;color:var(--amber);width:22px;text-align:right;flex:none}
.mrow{border:1px solid #22344c;border-radius:9px;padding:0 10px;margin:8px 0;background:#0b1729}
@media (prefers-reduced-motion:no-preference){.rv{animation:rv .45s ease-out both}@keyframes rv{from{opacity:0;transform:translateY(10px)}}}
.lg{position:fixed;inset:0;z-index:80;background:#0a1220;color:#f6f8fb;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lg-hud{display:flex;align-items:center;gap:10px;padding:8px 12px;max-width:900px;width:100%;margin:0 auto}
.lg-tm{display:flex;align-items:center;gap:8px;flex:1}.lg-tm.r{justify-content:flex-end}
.lg-sc{font-family:var(--disp);font-weight:800;font-size:30px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.lg-mid{text-align:center;font-family:var(--disp)}.lg-clk{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}.lg-sub{font-size:12.5px;color:#aebbd0}
.lg-pz{border:1px solid #33465f;background:#132033;color:#fff;border-radius:8px;width:38px;height:38px;font-weight:800;flex:none}
.lg-wrap{flex:1;position:relative;min-height:0}.lg-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lg-msg{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--disp);font-weight:800;font-size:44px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7);pointer-events:none}
.lg-name{position:absolute;left:10px;bottom:6px;font-size:13px;color:#c3cede;pointer-events:none;background:rgba(10,18,32,.7);padding:3px 8px;border-radius:6px}
.lg-ctl{flex:none;height:168px;display:flex;justify-content:space-between;align-items:center;padding:0 20px 8px;max-width:900px;width:100%;margin:0 auto}
.joy{width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.32);pointer-events:none}
.lgb{display:grid;grid-template-columns:auto auto;gap:12px;align-items:center;justify-items:center}
.lgbtn{width:78px;height:78px;border-radius:50%;border:0;font-family:var(--disp);font-weight:800;font-size:16px;color:#1a1300;background:var(--amber);touch-action:none}
.lgbtn.s{width:62px;height:62px;background:#22344c;color:#fff;font-size:14px}
.lg-keys{text-align:center;font-size:12.5px;color:#8fa0b8;padding:6px 10px 10px}
.lg-pause{position:absolute;inset:0;background:rgba(5,10,20,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:2}
.lg-pause[hidden]{display:none}
.lg-card{background:#132033;border:1px solid #26384f;border-radius:14px;padding:18px;max-width:420px;width:100%;color:#e8eef6}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.fgrid select{width:100%;min-width:0}
.lnk{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--link);text-align:left;cursor:pointer}
.rbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-top:8px}.rbtns .btn{padding:8px 4px;font-size:12.5px}
.xbtn{float:right;position:sticky;top:0;z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1;margin:-4px -2px 4px 10px;color:var(--ink)}
@media (max-width:440px){.nsm{display:none}h2{font-size:20px}.wrap{padding-left:12px;padding-right:12px}}
.court{height:6px;background:repeating-linear-gradient(90deg,var(--amber) 0 26px,transparent 26px 34px);margin-top:16px;opacity:.9}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

function simGame(g){

 while(hs===as){hs+=ri(4,14);as+=ri(4,14);ot++;}

function makeBox(t,pts){

function bkCreate(c,d,ev,neu){if(c.champ!==null||c.start+c.round!==d)return;c.cur=[];for(let i=0;i<c.e.length;i+=2){const x=c.e[i],y=c.e[i+1];let gid=null;if(x!==null&&y!==null){const sx=c.seed[x],sy=c.seed[y];gid=addGame(d,sx<sy?x:y,sx<sy?y:x,{n:neu(c.round),ev}).id;}c.cur.push([x,y,gid]);}}
function bkAdvance(c,d){if(c.champ!==null||c.start+c.round!==d||!c.cur)return false;c.hist.push(c.cur);c.e=c.cur.map(([x,y,g])=>g!==null?winner(G(g)):(x!==null?x:y));c.round++;c.cur=null;if(c.e.length===1){c.champ=c.e[0];return true;}return false;}
function nitFinish(id){const c=S.nit;if(!c||!c.seed[id])return null;if(c.champ===id)return "NIT champion";const n=c.hist.filter(r=>r.some(([x,y,g])=>g!==null&&(x===id||y===id))).length;return ["NIT first round","NIT first round","NIT second round","NIT quarterfinals","NIT semifinals","NIT runner-up"][n]||"NIT";}

function snap(p,t,pre){const g=p.s.g||1;return{n:p.fn+" "+p.ln,pos:p.pos,yr:cls(p),t:t.id,line:pre?p.ovr+" OVR":`${(p.s.pts/g).toFixed(1)} ppg, ${(p.s.reb/g).toFixed(1)} rpg, ${(p.s.ast/g).toFixed(1)} apg`};}
function coyScore(t){const g=t.w+t.l;return (g?t.w/g:.5)-expW(t)+t.w*.004;}
function coySnap(t){return{n:t.id===S.user?S.coach.name:(t.coach?t.coach.fn+" "+t.coach.ln:"Head coach"),t:t.id,line:`${rec(t)}, board expected ${Math.round(expW(t)*100)}%`};}

  const fr=list.find(([p])=>p.yr===1);out.foy=fr?snap(fr[0],fr[1]):null;const ct=keySort(teams,coyScore)[0];out.coy=ct?coySnap(ct):null;}
 return out;}

 const nat=honorSet(all,S.teams,pre);nat.third=all.slice(10,15).map(x=>snap(x[0],x[1],pre));nat.conf={};
 [...new Set(S.teams.map(t=>t.conf))].forEach(cf=>{nat.conf[cf]=honorSet(all.filter(([,t])=>t.conf===cf),S.teams.filter(t=>t.conf===cf),pre);});

function mg(a,b,g,seed){const row=(id,sc,w)=>id===null||id===undefined?`<div><span class="s"></span><span class="muted">TBD</span></div>`:`<div class="${w?"wn":""}"><span class="s">${seed?(seed[id]||""):""}</span>${badge(T(id),20)}<span style="${id===S.user?"color:var(--link)":""}">${esc(T(id).ab)}</span><span class="sc">${sc}</span></div>`;
 if(g&&g.done){return `<div class="mg">${row(g.h,g.hs,g.hs>g.as)}${row(g.a,g.as,g.as>g.hs)}</div>`;}return `<div class="mg">${row(a,"")}${row(b,"")}</div>`;}

 if(ri_<4){const slots=N.reg[ri_].map(e=>e<0?null:e);const cols=["Round of 64","Round of 32","Sweet 16","Elite Eight"];
  h+=`<div class="bk">${cols.map((cname,rd)=>{const gs=N.r[rd].map(G).filter(g=>g.reg===ri_);let cells=[];
   if(gs.length)cells=gs.map(g=>mg(g.h,g.a,g,N.seed));else if(rd===0)for(let i=0;i<16;i+=2)cells.push(mg(slots[i],slots[i+1],null,N.seed));else for(let i=0;i<8>>rd;i++)cells.push(mg(null,null));

 else{h+=`<div class="bk"><div class="col"><h4>National semifinals</h4>${N.r[4].length?N.r[4].map(i=>mg(0,0,G(i),N.seed)).join(""):mg(null,null)+mg(null,null)}</div><div class="col"><h4>Championship</h4>${N.r[5].length?mg(0,0,G(N.r[5][0]),N.seed):mg(null,null)}</div></div>`;

function splitName(nm){const i=nm.indexOf(" ");return i>0?[nm.slice(0,i),nm.slice(i+1)]:[nm,""];}
const TA='style="width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px"';
function openEditor(tid){if(tid!==undefined&&tid!==null)UI.edTeam=tid;if(UI.edTeam===undefined||UI.edTeam===null)UI.edTeam=S.user;const t=T(UI.edTeam),d=depth(t);
 UI.modal=`<h3>Edit teams and coaches</h3>
 <div class="row" style="gap:8px;margin:10px 0"><select data-act="edconf" aria-label="Conference" style="flex:1;min-width:0">${CONFS.map(c=>`<option ${c[0]===t.conf?"selected":""}>${esc(c[0])}</option>`).join("")}</select><select data-act="edteam" aria-label="Team" style="flex:1;min-width:0">${S.teams.filter(x=>x.conf===t.conf).map(x=>`<option value="${x.id}" ${x.id===t.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
 <label class="sm muted" for="edcoach">Head coach${t.id===S.user?" (you)":""}</label>
 <input type="text" id="edcoach" value="${esc(coachName(t))}" maxlength="40" style="width:100%;margin:4px 0 14px">
 <div class="row sm muted"><span class="grow">Players</span><span>OVR</span></div>
 ${d.map(p=>`<div class="row" style="margin:6px 0;gap:6px"><input type="text" data-ed="${p.id}" value="${esc((p.fn+" "+p.ln).trim())}" maxlength="40" aria-label="Player name" style="flex:1;min-width:0"><select data-edpos="${p.id}" aria-label="Position">${POS.map(x=>`<option ${x===p.pos?"selected":""}>${x}</option>`).join("")}</select><span class="num" style="width:24px;text-align:right">${p.ovr}</span></div>`).join("")}
 <div class="btns"><button class="btn pri" data-act="edsave">Save changes</button><button class="btn" data-act="close">Cancel</button></div>
 <h3 style="margin-top:20px">Paste a roster</h3><p class="sm muted" style="margin-top:0">Copy the roster table from a team page on ESPN or the school's athletics site and paste it below. Names, positions and classes replace this team's players in order; ratings stay the game's own.</p>
 <textarea id="edpaste" rows="6" ${TA} placeholder="Paste roster text here"></textarea><div class="btns"><button class="btn" data-act="edimport">Import roster</button></div>`;render();}
function edSave(){const t=T(UI.edTeam);
 document.querySelectorAll("[data-ed]").forEach(el=>{const p=t.roster.find(x=>x.id===+el.dataset.ed),nm=el.value.trim().replace(/\s+/g," ");if(p&&nm)[p.fn,p.ln]=splitName(nm);});
 document.querySelectorAll("[data-edpos]").forEach(el=>{const p=t.roster.find(x=>x.id===+el.dataset.edpos);if(p&&p.pos!==el.value){p.pos=el.value;p.ovr=calcOvr(p);p.pot=Math.max(p.pot,p.ovr);}});
 const cn=(document.getElementById("edcoach").value||"").trim().replace(/\s+/g," ");
 if(cn){if(t.id===S.user)S.coach.name=cn;else{if(!t.coach)t.coach=newCoach(t.pr);[t.coach.fn,t.coach.ln]=splitName(cn);}}
 UI.modal=null;toast(`Saved ${t.name}`);save();render();}
function parseRoster(txt){
 const cells=txt.split(/\r?\n/).flatMap(l=>l.split(/\t| {2,}/)).map(s=>s.trim()).filter(Boolean);
 const posRe=/^(PG|SG|SF|PF|G|F|C|G\/F|F\/G|F\/C|C\/F|GUARD|FORWARD|CENTER)$/i,clsRe=/^(R-?|RS-?)?(FR|SO|JR|SR|GR|5TH|FRESHMAN|SOPHOMORE|JUNIOR|SENIOR|GRADUATE|GRAD)\.?$/i;
 const nameRe=/^([A-Z][A-Za-z.'’\-]+(?: [A-Za-z.'’\-]+)+?)\s*#?\d{0,2}$/,bad=/[,\/]|\b(Academy|School|High|Prep|University|College|Institute|Name|Pos|Position|Height|Weight|Class|Hometown|Birthplace)\b/i;
 const out=[];let cur=null;
 cells.forEach(c=>{if(posRe.test(c)){if(cur&&!cur.pos)cur.pos=c.toUpperCase();return;}if(clsRe.test(c)){if(cur&&!cur.cls)cur.cls=c.toUpperCase();return;}
  if(bad.test(c))return;const m=c.match(nameRe);if(m){cur={name:m[1].trim()};out.push(cur);}});
 return out.slice(0,15);}
function edImport(){const t=T(UI.edTeam),list=parseRoster(document.getElementById("edpaste").value||"");
 if(list.length<5){toast("Couldn't find enough player names in that text");return;}
 const d=depth(t),used=new Set();let g=0,f=0;
 list.forEach((r,i)=>{let p=d[i];if(!p){p=newPlayer("SF",40+t.pr*.3,1);t.roster.push(p);}used.add(p.id);[p.fn,p.ln]=splitName(r.name);
  const P=(r.pos||"").toUpperCase();let pos=null;
  if(/^(PG|SG|SF|PF|C)$/.test(P))pos=P;else if(/G\/F|F\/G/.test(P))pos=(f++%2)?"SF":"SG";else if(/F\/C|C\/F/.test(P))pos="PF";else if(/^(G|GUARD)$/.test(P))pos=(g++%2)?"SG":"PG";else if(/^(F|FORWARD)$/.test(P))pos=(f++%2)?"PF":"SF";else if(/^(C|CENTER)$/.test(P))pos="C";
  if(pos&&pos!==p.pos){p.pos=pos;p.ovr=calcOvr(p);p.pot=Math.max(p.pot,p.ovr);}
  const C=(r.cls||"").replace(/[.\s]/g,"");const yr=/FR/.test(C)?1:/SO/.test(C)?2:/JR|JUN/.test(C)?3:/SR|SEN|GR|5TH/.test(C)?4:0;if(yr){p.yr=yr;if(/^R/.test(C))p.rsUsed=1;}});
 if(list.length>=9)t.roster=t.roster.filter(p=>used.has(p.id));
 save();toast(`Imported ${list.length} players to ${t.name}`);openEditor(t.id);}

/* ============ events ============ */
document.addEventListener("click",e=>{
 const stop=e.target.closest("[data-stop]");const el=e.target.closest("[data-act]");if(!el)return;if(stop&&el.dataset.act==="close"&&el.classList.contains("modal"))return;
 const a=el.dataset.act,v=el.dataset.v;
 if(a==="close"){if(el.classList.contains("modal")&&e.target!==el)return;UI.modal=null;render();return;}
 if(a==="tab"){UI.tab=v;UI.modal=null;render();window.scrollTo(0,0);return;}
 if(a==="seg"){if(el.dataset.name==="bk")UI.bkReg=+v;else UI.seg[el.dataset.name]=v;render();return;}
 if(a==="pickteam"){const n=(document.getElementById("cname")||{}).value||"";newGame(+v,n.trim()||"Coach "+pick(LASTN));UI.tab="home";render();return;}
 if(a==="play"){playNext();return;}
 if(a==="simweek"){let n=0;while(S.phase==="season"&&n<2){stepDay();n++;if(S.ncaa&&!S.selSeen)break;}save();render();maybeSel();return;}
 if(a==="simto"){simUntil(+v);return;}
 if(a==="box"){openBox(+v);return;}
 if(a==="player"){openPlayer(+v);return;}
 if(a==="rs"){rsToggle(+v);return;}
 if(a==="openeditor"){openEditor(S.user);return;}
 if(a==="story"){openStory(+v);return;}
 if(a==="live"){playLive();return;}
 if(a==="team"){openTeam(+v);return;}
 if(a==="recprof"){openRecruit(+v);return;}
 if(a==="lgstart"){startLive(+v);return;}
 if(a==="lgsimgame"){UI.modal=null;playNext();return;}
 if(a==="selshow"){openSel(0);return;}
 if(a==="selgo"){openSel(+v);return;}
 if(a==="selbracket"){const ur=userReg(S.ncaa);UI.modal=null;UI.tab="games";UI.seg.games="bracket";UI.bkReg=ur>=0?ur:0;render();window.scrollTo(0,0);return;}
 if(a==="edsave"){edSave();return;}
 if(a==="edimport"){edImport();return;}
 if(a==="realcoaches"){const n=applyRealCoaches();toast(`Loaded ${n} real head coaches`);save();render();return;}
 if(a==="rec"){recAct(+v,el.dataset.k);if(UI.modal&&UI.recOpen===+v)openRecruit(+v);return;}
 if(a==="portal"){portalOffer(+v);return;}
 if(a==="portaltab"){UI.tab="recruit";UI.seg.rec="portal";render();return;}
 if(a==="step"){advanceStep();window.scrollTo(0,0);return;}
 if(a==="takejob"){takeJob(+v);return;}
 if(a==="fire"){const s=S.staff[v];S.staff[v]=null;S.pool.push(s);toast(`Fired ${s.fn} ${s.ln}`);save();render();return;}
 if(a==="hire"){const s=S.pool[+v],cur=S.staff[s.role];S.pool.splice(+v,1);if(cur)S.pool.push(cur);S.staff[s.role]=s;toast(`Hired ${s.fn} ${s.ln}`);save();render();return;}
 if(a==="newgame"){flushSave();S=null;UI=FRESHUI("setup");refreshSlots().then(render);window.scrollTo(0,0);return;}
 if(a==="mydyn"){Promise.resolve(flushSave()).then(refreshSlots).then(()=>{S=null;UI=FRESHUI("manager");render();window.scrollTo(0,0);});return;}
 if(a==="newdyn"){UI.screen="setup";render();window.scrollTo(0,0);return;}
 if(a==="loaddyn"){openSlot(v);return;}
 if(a==="deldyn"){delSlot(v);return;}
 if(a==="renamedyn"){openRename(v);return;}
 if(a==="renamesave"){saveRename(v);return;}
 if(a==="exportdyn"){exportSlot(v);return;}
});
document.addEventListener("change",e=>{const el=e.target,a=el.dataset.act;
 if(a==="setconf"){UI.cname=(document.getElementById("cname")||{}).value;UI.setConf=el.value;render();}
 if(a==="rfilter"){UI.rFilter=el.value;render();}
 if(a==="rpos"){UI.rPos=el.value;render();}
 if(a==="confview"){UI.confView=el.value;render();}
 if(a==="edconf"){const t=S.teams.find(x=>x.conf===el.value);if(t)openEditor(t.id);}
 if(a==="edteam"){openEditor(+el.value);}
 if(a==="lgopt"){S.playOpts[el.dataset.k]=+el.value;save();}
 if(a==="rstate"){UI.rState=el.value;render();}
 if(a==="rint"){UI.rInt=el.value;render();}
 if(a==="rsort"){UI.rSort=el.value;render();}
 if(a==="importdyn"){importFile(el.files&&el.files[0]);el.value="";}
 if(a==="rosterfile"){rosterImport(el.files&&el.files[0]);el.value="";}
 if(a==="cstyle"){S.coach[el.dataset.k]=el.value;save();render();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&UI.modal){UI.modal=null;render();}});
init();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
